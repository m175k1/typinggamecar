<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Racer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header>
      <h1>🏎️ Typing Speed Racer</h1>
      <p class="subtitle">How fast can you type?</p>
    </header>

    <div class="stats">
      <div class="stat"><div class="stat-label">WPM</div><div class="stat-val" id="wpm">0</div></div>
      <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-val" id="acc">—</div></div>
      <div class="stat"><div class="stat-label">Time</div><div class="stat-val" id="timer">0s</div></div>
    </div>

    <div class="card">
      <div class="row-between">
        <span class="label">Difficulty</span>
        <select id="diff">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="track">
        <div class="track-road"></div>
        <div class="finish">🏁</div>
        <div class="car" id="car">🏎️</div>
      </div>
    </div>

    <div class="quote-box" id="quote-display">
      <span class="hint">Press Start to load a quote...</span>
    </div>

    <textarea id="typeinput" rows="2" placeholder="Click Start, then type here..." disabled></textarea>

    <div id="result-banner" class="result-banner hidden">
      <div class="result-top">
        <div>
          <h3 id="result-title">Race complete! 🏁</h3>
          <p id="result-detail"></p>
        </div>
      </div>
      <div class="save-row">
        <input type="text" id="username-input" maxlength="20" placeholder="Your name..." />
        <button id="btn-save">Save Score</button>
      </div>
      <div id="save-status" class="save-status hidden"></div>
    </div>

    <div class="btn-row">
      <button id="btn-start" class="btn-primary">▶ Start</button>
      <button id="btn-reset" class="btn-ghost">↺ Reset</button>
    </div>

    <div class="card leaderboard-card">
      <div class="row-between">
        <h2 class="lb-title">🏆 Leaderboard</h2>
        <select id="lb-diff">
          <option value="all">All difficulties</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div id="leaderboard"><p class="lb-state">Loading scores...</p></div>
    </div>

    <footer><p>Powered by Firebase · Hosted on GitHub Pages</p></footer>

  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
